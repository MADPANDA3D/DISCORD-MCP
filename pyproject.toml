[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "mad-mcp-discord"
version = "1.0.1"
description = "A dual-mode MCP server for bounded Discord operations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "MADPANDA3D" }]
keywords = ["mcp", "discord", "automation", "ai-agents", "fastmcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiohttp>=3.14.3,<4",
  "cryptography>=50.0.0,<51",
  "discord.py>=2.7.1,<3",
  "mcp==1.28.1",
  "starlette>=1.3.1,<2",
  "tzdata>=2026.3",
  "uvicorn>=0.51.0,<1",
]

[project.urls]
Homepage = "https://github.com/MADPANDA3D/DISCORD-MCP"
Documentation = "https://github.com/MADPANDA3D/DISCORD-MCP#readme"
Issues = "https://github.com/MADPANDA3D/DISCORD-MCP/issues"
Security = "https://github.com/MADPANDA3D/DISCORD-MCP/security/policy"
Source = "https://github.com/MADPANDA3D/DISCORD-MCP"

[dependency-groups]
dev = [
  "bandit[toml]>=1.9.2,<2",
  "build>=1.3.0,<2",
  "pip-audit>=2.9.0,<3",
  "ruff>=0.15.0,<1",
  "twine>=6.2.0,<7",
]

[project.scripts]
mad-mcp-discord = "madpanda_discord_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/madpanda_discord_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/madpanda_discord_mcp",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests"]
