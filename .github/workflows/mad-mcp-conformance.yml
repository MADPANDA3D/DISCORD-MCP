name: MAD MCP conformance

on:
  pull_request:
  push:
    branches: [main, feat/discord-tool-manifest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out provider source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastmcp/requirements.txt

      - name: Install provider dependencies
        run: python -m pip install -r fastmcp/requirements.txt

      - name: Run complete provider tests
        run: python -m unittest discover -s fastmcp/tests -p 'test_*.py' -v

      - name: Verify tracked manifest contract
        run: |
          set -euo pipefail
          git ls-files --error-unmatch \
            fastmcp/discord_admin_api.py \
            fastmcp/tool_manifest.py \
            fastmcp/tests/test_discord_admin_api.py \
            fastmcp/tests/test_tool_manifest.py >/dev/null
          python -m unittest discover -s fastmcp/tests -p 'test_tool_manifest.py' -v

      - name: Scan tracked files for credential material
        shell: python
        run: |
          import pathlib
          import re
          import subprocess

          rules = (
              ("private-key", re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("github-token", re.compile(rb"(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{40,255})")),
              ("openai-key", re.compile(rb"(?<![A-Za-z0-9])sk-(?:proj-)?[A-Za-z0-9_-]{32,}")),
              ("discord-bot-token", re.compile(rb"(?<![A-Za-z0-9])[A-Za-z0-9_-]{24,28}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,40}(?![A-Za-z0-9])")),
          )
          findings = []
          tracked = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.split(b"\0")
          for encoded in tracked:
              if not encoded:
                  continue
              relative = encoded.decode("utf-8", "surrogateescape")
              path = pathlib.Path(relative)
              if path.name in {".env", ".env.local", ".env.production"}:
                  findings.append((relative, "tracked-env"))
                  continue
              payload = path.read_bytes()
              if b"\0" in payload:
                  continue
              for label, pattern in rules:
                  if pattern.search(payload):
                      findings.append((relative, label))
          if findings:
              for relative, label in findings:
                  print(f"credential scan failed: {relative}: {label}")
              raise SystemExit(1)

  image:
    name: Hardened image and health
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out provider source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Compose contract
        env:
          MCP_BUILD_SHA: ${{ github.sha }}
          MCP_PORTAL_GRANT_TOKEN: ci-placeholder-grant
          DISCORD_TOKEN: ""
          DISCORD_GUILD_ID: ""
        run: docker compose -f fastmcp/docker-compose.yaml config --quiet

      - name: Build exact candidate image
        run: |
          docker build \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --tag "discord-mcp-ci:${GITHUB_SHA}" \
            fastmcp

      - name: Smoke health and catalog parity
        env:
          IMAGE_NAME: discord-mcp-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          container_name="discord-mcp-ci-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name "$container_name" \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18085:8085 \
            --env MCP_PUBLIC_MODE=false \
            --env MCP_PORTAL_GRANT_TOKEN=ci-placeholder-grant \
            --env DISCORD_TOKEN=ci-placeholder-token \
            --env DISCORD_GUILD_ID=123456789012345678 \
            "$IMAGE_NAME"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18085/health > /tmp/discord-health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          with open("/tmp/discord-health.json", encoding="utf-8") as stream:
              health = json.load(stream)
          assert health["ok"] is True
          assert health["configuration_ready"] is True
          assert health["build_sha"] == "${{ github.sha }}"
          assert health["raw_tool_count"] == 55
          assert health["exposed_tool_count"] == 55
          assert health["agent_ready_tool_count"] == 49
          assert health["documented_tool_count"] == 55
          assert health["tool_count"] == 55
          PY
