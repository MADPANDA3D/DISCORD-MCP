services:
  discord-mcp:
    container_name: discord-mcp
    image: fastmcp-discord-mcp:${MCP_BUILD_SHA:?MCP_BUILD_SHA must be the deployed commit SHA}
    build:
      context: .
      args:
        BUILD_SHA: ${MCP_BUILD_SHA:?MCP_BUILD_SHA must be the deployed commit SHA}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      org.opencontainers.image.revision: ${MCP_BUILD_SHA:?MCP_BUILD_SHA must be the deployed commit SHA}
      org.opencontainers.image.version: ${MCP_BUILD_SHA:?MCP_BUILD_SHA must be the deployed commit SHA}
    environment:
      MCP_PUBLIC_MODE: "${MCP_PUBLIC_MODE:-true}"
      MCP_BUILD_SHA: "${MCP_BUILD_SHA:?MCP_BUILD_SHA must be the deployed commit SHA}"
      MCP_PORTAL_GRANT_TOKEN: "${MCP_PORTAL_GRANT_TOKEN:?MCP_PORTAL_GRANT_TOKEN is required}"
      MCP_PORTAL_GRANT_HEADER: "${MCP_PORTAL_GRANT_HEADER:-X-MADPANDA-PORTAL-GRANT}"
      DISCORD_TOKEN: "${DISCORD_TOKEN}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID}"
      DISCORD_PRIMARY_CHANNEL_ID: "${DISCORD_PRIMARY_CHANNEL_ID:-1455591724532629627}"
      DISCORD_ALLOWED_CHANNEL_IDS: "${DISCORD_ALLOWED_CHANNEL_IDS:-}"
      DISCORD_ALLOW_ALL_READ: "${DISCORD_ALLOW_ALL_READ:-true}"
      MCP_ADMIN_TOOLS_ENABLED: "${MCP_ADMIN_TOOLS_ENABLED:-true}"
      MCP_REQUIRE_CONFIRM: "${MCP_REQUIRE_CONFIRM:-false}"
      DISCORD_DM_ENABLED: "${DISCORD_DM_ENABLED:-false}"
      LOG_REDACT_MESSAGE_CONTENT: "${LOG_REDACT_MESSAGE_CONTENT:-true}"
      DISCORD_AUDIT_TIMEZONE: "${DISCORD_AUDIT_TIMEZONE:-America/Los_Angeles}"
      DISCORD_BLOCKED_CHANNEL_IDS: "${DISCORD_BLOCKED_CHANNEL_IDS:-}"
      DISCORD_PROTECTED_USER_IDS: "${DISCORD_PROTECTED_USER_IDS:-}"
      DISCORD_PROTECTED_ROLE_IDS: "${DISCORD_PROTECTED_ROLE_IDS:-}"
      DISCORD_ALLOWED_TARGET_ROLE_IDS: "${DISCORD_ALLOWED_TARGET_ROLE_IDS:-}"
      MCP_ALLOW_REQUEST_OVERRIDES: "${MCP_ALLOW_REQUEST_OVERRIDES:-true}"
      OPENAI_VISION_ENABLED: "${OPENAI_VISION_ENABLED:-false}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-4o-mini}"
      OPENAI_VISION_API_URL: "${OPENAI_VISION_API_URL:-https://api.openai.com/v1/chat/completions}"
      OPENAI_VISION_MAX_MB: "${OPENAI_VISION_MAX_MB:-10}"
      OPENAI_VISION_TIMEOUT_SECONDS: "${OPENAI_VISION_TIMEOUT_SECONDS:-30}"
      DISCORD_ATTACHMENT_MAX_MB: "${DISCORD_ATTACHMENT_MAX_MB:-25}"
      DISCORD_ATTACHMENT_URL_TIMEOUT_SECONDS: "${DISCORD_ATTACHMENT_URL_TIMEOUT_SECONDS:-20}"
      MCP_ATTACHMENT_ALLOWED_DIRS: "${MCP_ATTACHMENT_ALLOWED_DIRS:-}"
      MCP_OPENAI_API_HEADER: "${MCP_OPENAI_API_HEADER:-x-openai-api}"
      MCP_REQUIRE_REQUEST_DISCORD_TOKEN: "${MCP_REQUIRE_REQUEST_DISCORD_TOKEN:-true}"
      MCP_REQUIRE_REQUEST_GUILD_ID: "${MCP_REQUIRE_REQUEST_GUILD_ID:-true}"
      MCP_REQUIRE_REQUEST_BLOCKED_CHANNELS: "${MCP_REQUIRE_REQUEST_BLOCKED_CHANNELS:-}"
      MCP_DISCORD_TOKEN_HEADER: "${MCP_DISCORD_TOKEN_HEADER:-x-discord-bot-token}"
      MCP_DISCORD_GUILD_ID_HEADER: "${MCP_DISCORD_GUILD_ID_HEADER:-x-discord-guild-id}"
      MCP_DISCORD_BLOCKED_CHANNELS_HEADER: "${MCP_DISCORD_BLOCKED_CHANNELS_HEADER:-x-discord-blocked-channels}"
      MCP_DISCORD_ALLOW_ALL_READ_HEADER: "${MCP_DISCORD_ALLOW_ALL_READ_HEADER:-x-discord-allow-all-read}"
      MCP_DISCORD_DM_ENABLED_HEADER: "${MCP_DISCORD_DM_ENABLED_HEADER:-x-discord-dm-enabled}"
      MCP_ADMIN_TOOLS_ENABLED_HEADER: "${MCP_ADMIN_TOOLS_ENABLED_HEADER:-x-mcp-admin-tools-enabled}"
      MCP_REQUIRE_CONFIRM_HEADER: "${MCP_REQUIRE_CONFIRM_HEADER:-x-mcp-require-confirm}"
      MCP_BOT_POOL_TTL_SECONDS: "${MCP_BOT_POOL_TTL_SECONDS:-900}"
      DISCORD_CHANNEL_CACHE_TTL_SECONDS: "${DISCORD_CHANNEL_CACHE_TTL_SECONDS:-600}"
      DISCORD_JOB_TTL_SECONDS: "${DISCORD_JOB_TTL_SECONDS:-3600}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=3)); assert data.get('status') == 'ok' and data.get('configuration_ready') is True and int(data.get('tool_count', 0)) > 0",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
          pids: 256
    networks:
      - mcp-network
networks:
  mcp-network:
    external: true
